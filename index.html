<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Balance">
<link rel="manifest" href="manifest.json">
<title>Balance</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f5f0eb;--card:#fffdf9;--text:#4a3f35;--text-light:#8c7e72;--text-muted:#b5a99a;--border:#e8e0d6;--accent:#c4956a;--accent-light:#e8d5c0;--green:#7a9e7e;--red:#c47a7a;--shadow:0 2px 12px rgba(74,63,53,0.06)}
body{font-family:'Zen Maru Gothic','Noto Sans TC',-apple-system,sans-serif;background:var(--bg);max-width:480px;margin:0 auto;min-height:100vh;min-height:-webkit-fill-available;color:var(--text);overflow-x:hidden}

/* Nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:50;padding:6px 0;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border:none;background:none;color:var(--text-muted);font-size:10px;cursor:pointer;font-family:inherit;transition:.2s}
.nav-item.active{color:var(--accent)}
.nav-item .icon{font-size:22px}

/* Pages */
.page{display:none;padding:16px 16px 100px}
.page.active{display:block}

/* Common */
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:13px;color:var(--text-light);margin-bottom:10px;font-weight:500}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-top:4px}
.header h1{font-size:22px;font-weight:700}
.header .sub{font-size:11px;color:var(--text-muted);margin-top:2px}
.settings-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--card);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* Record page */
.mic-area{display:flex;flex-direction:column;align-items:center;padding:16px 0}
.mic-btn{width:72px;height:72px;border-radius:50%;border:3px solid var(--accent);background:var(--card);color:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:28px;transition:.3s;box-shadow:0 4px 20px rgba(196,149,106,0.15)}
.mic-btn.recording{background:var(--red);border-color:var(--red);color:#fff;animation:pulse 1.5s infinite;box-shadow:0 0 0 8px rgba(196,122,122,0.12)}
.mic-btn.processing{opacity:.5;pointer-events:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 8px rgba(196,122,122,0.12)}50%{box-shadow:0 0 0 16px rgba(196,122,122,0.06)}}
.mic-hint{margin-top:8px;font-size:12px;color:var(--text-muted)}
.transcript{margin:0 0 12px;padding:10px 14px;border-radius:10px;background:var(--card);border:1.5px dashed var(--accent-light);font-size:14px;display:none}
.transcript.show{display:block}
.manual{display:flex;gap:8px;margin-bottom:12px}
.manual input{flex:1;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);font-size:14px;outline:none;background:var(--card);font-family:inherit}
.manual input:focus{border-color:var(--accent)}
.manual input::placeholder{color:var(--text-muted)}
.manual button{padding:10px 16px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.status{padding:8px 14px;margin-bottom:12px;border-radius:8px;font-size:12px;text-align:center;display:none}
.status.show{display:block}
.status.ok{background:rgba(122,158,126,0.12);color:var(--green)}
.status.err{background:rgba(196,122,122,0.12);color:var(--red)}
.status.info{background:rgba(196,149,106,0.12);color:var(--accent)}

.expense-card{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);border-left:3px solid var(--accent);border-right:1px solid var(--border);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.expense-card.confirmed{opacity:.6}
.expense-top{display:flex;justify-content:space-between;align-items:flex-start}
.expense-name{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.expense-name .desc{font-weight:600;font-size:14px}
.expense-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{padding:1px 7px;border-radius:5px;font-size:11px;font-weight:500;background:var(--accent-light);color:var(--accent)}
.tag-dim{padding:1px 7px;border-radius:5px;font-size:11px;background:#f0ebe4;color:var(--text-muted)}
.exp-amount{font-size:20px;font-weight:700}
.exp-actions{display:flex;gap:6px;margin-top:10px;justify-content:flex-end}
.exp-actions button{padding:5px 10px;border-radius:8px;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;background:none}
.btn-del{color:var(--red)}.btn-edit{color:var(--accent)}.btn-ok{background:var(--green)!important;color:#fff}

/* Overview page */
.summary-row{display:flex;gap:10px;margin-bottom:12px}
.summary-item{flex:1;background:var(--card);border-radius:12px;padding:12px;border:1px solid var(--border);text-align:center}
.summary-item .label{font-size:11px;color:var(--text-muted);margin-bottom:4px}
.summary-item .value{font-size:20px;font-weight:700}
.summary-item .value.small{font-size:16px}
.period-tabs{display:flex;gap:4px;margin-bottom:12px}
.period-tab{flex:1;padding:6px;border-radius:8px;border:none;background:var(--card);color:var(--text-muted);font-size:12px;font-weight:500;cursor:pointer;text-align:center;font-family:inherit;border:1px solid var(--border)}
.period-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.chart-container{display:flex;justify-content:center;padding:8px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-light)}
.legend-dot{width:10px;height:10px;border-radius:3px}
.pay-stat{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pay-stat .name{font-size:12px;width:70px;text-align:right;color:var(--text-light);flex-shrink:0}
.pay-stat .bar{flex:1;height:14px;background:#f0ebe4;border-radius:7px;overflow:hidden}
.pay-stat .bar-fill{height:100%;border-radius:7px;transition:width .5s}
.pay-stat .amount{font-size:12px;font-weight:600;width:80px;text-align:right}

/* History page */
.record-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.record-row:last-child{border-bottom:none}
.record-desc{font-size:13px;font-weight:500}
.record-meta{font-size:11px;color:var(--text-muted);margin-top:2px}
.record-amount{font-size:14px;font-weight:700;white-space:nowrap}
.dup-tag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:5px;font-size:10px;font-weight:600;background:rgba(196,122,122,0.12);color:var(--red);vertical-align:1px}
.dup-banner{background:rgba(196,122,122,0.10);border:1px solid rgba(196,122,122,0.35);color:var(--red);border-radius:10px;padding:10px 12px;font-size:12px;margin-bottom:10px;line-height:1.6}

/* Credit Card page */
.cc-card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;border:1px solid var(--border);cursor:pointer;transition:.2s}
.cc-card:active{transform:scale(0.98)}
.cc-card.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-light)}
.cc-name{font-weight:600;font-size:15px}
.cc-cycle{font-size:11px;color:var(--text-muted);margin-top:2px}
.cc-total{font-size:18px;font-weight:700;margin-top:4px}
.cc-detail{margin-top:8px;background:#faf6f1;border-radius:10px;overflow:hidden}
.cc-detail-item{padding:10px 14px;display:flex;justify-content:space-between;border-bottom:1px solid var(--border);font-size:13px}
.cc-detail-item:last-child{border-bottom:none}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:none;align-items:flex-end;justify-content:center;z-index:100}
.overlay.show{display:flex}
.modal{background:var(--card);border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto}
.modal h2{font-size:18px;font-weight:700;margin-bottom:16px}
.modal label{display:block;font-size:12px;font-weight:600;color:var(--text-light);margin:10px 0 4px}
.modal input,.modal select{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;outline:none;font-family:inherit}
.modal input:focus,.modal select:focus{border-color:var(--accent)}
.modal .hint{font-size:11px;color:var(--text-muted);margin-top:2px}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions button{flex:1;padding:10px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;font-family:inherit}
.btn-cancel{background:var(--bg);color:var(--text-light)}.btn-save{background:var(--accent);color:#fff}
.loading{text-align:center;padding:32px;color:var(--text-muted);font-size:13px}
</style>
</head>
<body>

<!-- Bottom Nav -->
<div class="nav">
  <button class="nav-item active" onclick="goPage(0)"><span class="icon">🎙</span>記帳</button>
  <button class="nav-item" onclick="goPage(1)"><span class="icon">📊</span>總覽</button>
  <button class="nav-item" onclick="goPage(2)"><span class="icon">💳</span>信用卡</button>
  <button class="nav-item" onclick="goPage(3)"><span class="icon">📋</span>紀錄</button>
</div>

<!-- Page 0: Record -->
<div class="page active" id="page0">
  <div class="header"><div><h1>Balance</h1><div class="sub">說一句話，自動入帳</div></div><button class="settings-btn" onclick="openSetup()">⚙</button></div>
  <div class="mic-area">
    <div style="display:flex;gap:20px;align-items:center">
      <button class="mic-btn" id="micBtn" onclick="toggleMic()">🎤</button>
      <button class="mic-btn" id="camBtn" onclick="document.getElementById('camInput').click()" style="background:var(--card);border:3px solid var(--green);color:var(--green);box-shadow:0 4px 20px rgba(122,158,126,0.15)">📷</button>
    </div>
    <input type="file" id="camInput" accept="image/*" capture="environment" style="display:none" onchange="handlePhoto(this)">
    <div class="mic-hint" id="micHint">🎤 語音 ｜ 📷 拍照</div>
  </div>
  <div id="photoPreview" style="display:none;margin:0 0 12px;text-align:center">
    <img id="photoImg" style="max-width:100%;max-height:200px;border-radius:10px;border:1px solid var(--border)">
  </div>
  <div class="transcript" id="transcript"></div>
  <div class="manual"><input type="text" id="manualInput" placeholder="午餐便當 80" onkeydown="if(event.key==='Enter')manualSubmit()"><button onclick="manualSubmit()">送出</button></div>
  <div class="status" id="statusBar"></div>
  <div id="expenseList"><div class="loading" id="emptyState">🎙️ 按下麥克風開始記帳</div></div>
</div>

<!-- Page 1: Overview -->
<div class="page" id="page1">
  <div class="header"><div><h1>支出總覽</h1></div><button class="settings-btn" onclick="loadSheetData()">🔄</button></div>
  <div class="period-tabs">
    <button class="period-tab" onclick="setPeriod('today',this)">今日</button>
    <button class="period-tab" onclick="setPeriod('week',this)">本週</button>
    <button class="period-tab active" onclick="setPeriod('month',this)">本月</button>
    <button class="period-tab" onclick="setPeriod('all',this)">全部</button>
  </div>
  <div id="yearSelector" style="display:none;align-items:center;justify-content:center;gap:12px;margin:-8px 0 12px">
    <button onclick="changeYear(-1)" style="border:none;background:var(--card);border-radius:8px;padding:4px 10px;font-size:16px;cursor:pointer;color:var(--accent);border:1px solid var(--border)">◀</button>
    <span id="yearLabel" style="font-size:15px;font-weight:600;min-width:50px;text-align:center"></span>
    <button onclick="changeYear(1)" style="border:none;background:var(--card);border-radius:8px;padding:4px 10px;font-size:16px;cursor:pointer;color:var(--accent);border:1px solid var(--border)">▶</button>
  </div>
  <div class="summary-row">
    <div class="summary-item"><div class="label">總支出</div><div class="value" id="ovTotal">$0</div></div>
    <div class="summary-item"><div class="label">筆數</div><div class="value small" id="ovCount">0</div></div>
    <div class="summary-item"><div class="label">日均</div><div class="value small" id="ovAvg">$0</div></div>
  </div>
  <div class="card"><div class="card-title">📊 分類比例</div><div class="chart-container"><canvas id="pieChart" width="200" height="200"></canvas></div><div class="legend" id="pieLegend"></div></div>
  <div class="card"><div class="card-title">💰 帳戶支出</div><div id="payStats"></div></div>
</div>

<!-- Page 2: Credit Cards -->
<div class="page" id="page2">
  <div class="header"><div><h1>信用卡帳單</h1><div class="sub">當期消費明細</div></div></div>
  <div id="ccList"></div>
  <div id="ccDetail"></div>
</div>

<!-- Page 3: History -->
<div class="page" id="page3">
  <div class="header"><div><h1>交易紀錄</h1></div></div>
  <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px">
    <button onclick="changeHistMonth(-1)" style="border:none;background:var(--card);border-radius:8px;padding:4px 10px;font-size:16px;cursor:pointer;color:var(--accent);border:1px solid var(--border)">◀</button>
    <span id="histMonthLabel" style="font-size:15px;font-weight:600;min-width:100px;text-align:center"></span>
    <button onclick="changeHistMonth(1)" style="border:none;background:var(--card);border-radius:8px;padding:4px 10px;font-size:16px;cursor:pointer;color:var(--accent);border:1px solid var(--border)">▶</button>
  </div>
  <div style="margin-bottom:12px">
    <input type="text" id="histSearch" placeholder="🔍 搜尋（例如 Kobo、全聯）" oninput="renderHistory()" style="width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);font-size:14px;outline:none;background:var(--card);font-family:inherit">
  </div>
  <div id="historyList"><div class="loading">點選「總覽」載入資料</div></div>
</div>

<!-- Setup Modal -->
<div class="overlay" id="setupModal"><div class="modal"><h2>⚙️ 設定</h2>
  <label>Cloudflare Worker URL</label><input type="url" id="cfgW" placeholder="https://balance-proxy.xxx.workers.dev"><p class="hint">解決 CORS 的轉發器</p>
  <label>Claude API Key</label><input type="password" id="cfgK" placeholder="sk-ant-..."><p class="hint">存在手機本地</p>
  <label>Google Apps Script URL</label><input type="url" id="cfgU" placeholder="https://script.google.com/macros/s/...">
  <label>驗證密碼 (Token)</label><input type="password" id="cfgT" placeholder="與 Apps Script 一致">
  <div class="modal-actions"><button class="btn-cancel" onclick="closeSetup()">取消</button><button class="btn-save" onclick="saveConfig()">儲存</button></div>
</div></div>

<!-- Edit Modal -->
<div class="overlay" id="editModal"><div class="modal"><h2>編輯</h2>
  <label>日期</label><input type="date" id="editDate">
  <label>項目</label><input type="text" id="editDesc">
  <label>金額</label><input type="number" id="editAmount">
  <label>帳戶</label>
  <select id="editPayment"><option>現金</option><option>合庫</option><option>永豐(23日結帳8日繳款)</option><option>匯豐卡(18日結帳8日付款)</option><option>樂天熊貓卡(5日結帳26日繳款)</option><option>樂天晶緻卡(5日結帳26日繳款)</option><option>玉山PI錢包(10日結帳26日繳款)</option><option>玉山國旅卡(10日結帳26日繳款)</option><option>國泰CUBE卡(8日結帳2日繳款)</option><option>富邦MOMO卡(8日結帳24日繳款)</option></select>
  <label>幣別</label>
  <select id="editCurrency"><option>新台幣</option><option>日幣</option><option>美金</option><option>歐元</option></select>
  <label>分類</label>
  <select id="editCategory"><option>外食</option><option>食材採買</option><option>電子書</option><option>子女教育</option><option>生活用品</option><option>健身運動</option><option>衣物</option><option>旅遊住宿</option><option>軟體訂閱</option><option>帳務轉帳</option><option>保健</option><option>圖書</option><option>交通</option><option>文具</option><option>美妝保養</option><option>保險</option><option>電信費</option><option>禮物</option><option>證件規費</option></select>
  <div style="display:flex;gap:8px">
    <div style="flex:1"><label>匯率</label><input type="number" id="editRate" step="0.01" placeholder="1"></div>
    <div style="flex:1"><label>台幣等值</label><input type="number" id="editTWD" placeholder="自動計算"></div>
  </div>
  <div class="modal-actions"><button class="btn-cancel" onclick="closeEdit()">取消</button><button class="btn-save" onclick="saveEdit()">儲存</button></div>
</div></div>

<script>
// === Constants ===
const ICONS={"外食":"🍜","食材採買":"🥬","電子書":"📱","子女教育":"🎓","生活用品":"🧴","健身運動":"💪","衣物":"👔","旅遊住宿":"✈️","軟體訂閱":"💻","帳務轉帳":"🔄","保健":"💊","圖書":"📚","交通":"🚗","文具":"✏️","美妝保養":"💄","保險":"🛡️","電信費":"📡","禮物":"🎁","證件規費":"📋"};
const PAY_COLORS={"現金":"#7a9e7e","合庫":"#6b8cae","永豐(23日結帳8日繳款)":"#9b7bb5","匯豐卡(18日結帳8日付款)":"#c47a7a","樂天熊貓卡(5日結帳26日繳款)":"#c4956a","樂天晶緻卡(5日結帳26日繳款)":"#8c6239","玉山PI錢包(10日結帳26日繳款)":"#6aafb5","玉山國旅卡(10日結帳26日繳款)":"#7ab59e","國泰CUBE卡(8日結帳2日繳款)":"#b5a46a","富邦MOMO卡(8日結帳24日繳款)":"#b56a8c"};
const CAT_COLORS={"外食":"#c4956a","食材採買":"#7a9e7e","電子書":"#9b7bb5","子女教育":"#6b8cae","生活用品":"#6aafb5","健身運動":"#7ab59e","衣物":"#b5a46a","旅遊住宿":"#c49a6a","軟體訂閱":"#8b7bc4","帳務轉帳":"#8c7e72","保健":"#c47a7a","圖書":"#ae6b8c","交通":"#b56a8c","文具":"#9eb57a","美妝保養":"#c48fa0","保險":"#6a9eb5","電信費":"#8c8c8c","禮物":"#c49a9a","證件規費":"#a0956a"};
const CARDS=[
  {name:"匯豐卡",full:"匯豐卡(18日結帳8日付款)",close:18,pay:8},
  {name:"樂天熊貓卡",full:"樂天熊貓卡(5日結帳26日繳款)",close:5,pay:26},
  {name:"樂天晶緻卡",full:"樂天晶緻卡(5日結帳26日繳款)",close:5,pay:26},
  {name:"玉山PI錢包",full:"玉山PI錢包(10日結帳26日繳款)",close:10,pay:26},
  {name:"玉山國旅卡",full:"玉山國旅卡(10日結帳26日繳款)",close:10,pay:26},
  {name:"國泰CUBE卡",full:"國泰CUBE卡(8日結帳2日繳款)",close:8,pay:2},
  {name:"富邦MOMO卡",full:"富邦MOMO卡(8日結帳24日繳款)",close:8,pay:24},
  {name:"永豐",full:"永豐(23日結帳8日繳款)",close:23,pay:8},
];
// 回饋加碼上限（資料時點 2026-07 H2 方案，權益半年一改，改方案時同步更新 Heptabase「信用卡刷卡決策」卡）
// 加碼額度按「曆月」計算，非帳單期
const REWARD_RULES={
  "永豐(23日結帳8日繳款)":{label:"大戶加碼",cap:16000,match:r=>true,tip:"超額後回饋掉回國內1%/國外2%，國外改刷CUBE趣旅行"},
  "樂天熊貓卡(5日結帳26日繳款)":{label:"日韓泰加碼",cap:20000,match:r=>r.currency==='日幣',tip:"只計得到日幣消費（韓泰幣別App無法辨識）"}

// === Local Date (UTC+8) ===
function getLocalDate(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtLocal(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
// 'YYYY-MM-DD' 要當本地日期解析：new Date(字串) 會解成 UTC 午夜＝台灣早上八點，
// 導致結帳日當天的消費同時掉出本期（>期末）與下期（<期初），從帳單上消失
function parseLocalDate(s){const m=String(s).match(/(\d{4})-(\d{1,2})-(\d{1,2})/);return m?new Date(+m[1],+m[2]-1,+m[3]):new Date(s);}

// 單一 key 儲存：舊版按日期存 key，跨過午夜後前一天未入帳的項目就看不到了
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function loadExpenses(){
  try{
    const s=localStorage.getItem('bal-exp-pending');
    if(s){const d=JSON.parse(s);expenses=d.e||[];confirmedSet=new Set(d.c||[]);}
    else{
      const e=[],c=[];
      for(let i=localStorage.length-1;i>=0;i--){
        const k=localStorage.key(i);
        if(k&&/^bal-exp-\d{4}-\d{2}-\d{2}$/.test(k)){
          try{const d=JSON.parse(localStorage.getItem(k));(d.e||[]).forEach(x=>e.push(x));(d.c||[]).forEach(x=>c.push(x));}catch{}
          localStorage.removeItem(k);
        }
      }
      expenses=e;confirmedSet=new Set(c);
      if(e.length)saveExpenses();
    }
    pruneConfirmed();
  }catch{}
}
function saveExpenses(){localStorage.setItem('bal-exp-pending',JSON.stringify({e:expenses,c:[...confirmedSet]}));}
function pruneConfirmed(){
  // 已入帳3天自清（資料已在 Sheet）；未入帳超過7天視為棄置草稿也自清
  //（暫存區的定位是當天~隔天的待確認清單，一週沒入帳＝當初就不打算入了）
  const d3=new Date();d3.setDate(d3.getDate()-3);const co3=fmtLocal(d3);
  const d7=new Date();d7.setDate(d7.getDate()-7);const co7=fmtLocal(d7);
  const before=expenses.length;
  expenses=expenses.filter(it=>{
    if(confirmedSet.has(it._id))return it.date>=co3;
    return (it.date||'9999')>=co7;
  });
  if(expenses.length!==before){
    const ids=new Set(expenses.map(it=>it._id));
    confirmedSet=new Set([...confirmedSet].filter(id=>ids.has(id)));
    saveExpenses();
  }
}

// 解讀 GAS 回應內容，回傳錯誤訊息（null＝成功）。
// 新版後端回 JSON {ok,error}；最早期版本回純文字 OK / Unauthorized；
// token 不符、換部署後沒重新授權時，Google 會回 HTML 錯誤頁——
// 這些以前都被當成功顯示「✓ 已入帳」，帳就默默消失了
function gasError(raw){
  let j=null;try{j=JSON.parse(raw);}catch{}
  if(j!==null&&typeof j==='object'){
    if(Array.isArray(j)||j.ok===true)return null;
    const e=j.error||(j.ok===false?'後端回報失敗':null);
    if(!e)return null;
    return /unauthor/i.test(e)?'Token 驗證失敗：App 設定的驗證密碼和 GAS 指令碼屬性 TOKEN 不一致':String(e);
  }
  if(/^\s*OK\b/.test(raw))return null;
  if(/unauthor/i.test(raw))return 'Token 驗證失敗：App 設定的驗證密碼和 GAS 指令碼屬性 TOKEN 不一致';
  if(/<\w+[^>]*>/.test(raw))return 'GAS 回了錯誤頁：可能換版後尚未重新授權（到 Apps Script 編輯器手動執行一次函式完成授權），或部署設定有誤';
  return '無法解讀 GAS 回應：'+raw.slice(0,80);
}
// Claude 解析錯誤轉成可行動訊息：invalid x-api-key＝存的金鑰壞了
//（設定頁兩個密碼欄位長一樣，改 token 時容易誤蓋 API Key）
function claudeErrMsg(err){
  const m=String(err&&err.message||err);
  if(/x-api-key|authentication/i.test(m))return 'Claude API Key 無效：請開 ⚙ 設定重新貼上 sk-ant- 開頭的金鑰（改設定時可能被覆蓋）';
  if(/credit|billing/i.test(m))return 'Claude API 額度不足，請到 console.anthropic.com 檢查餘額';
  return '解析失敗: '+m;
}

// 送出中的項目 ID：入帳寫入有延遲，手滑連點兩次會 POST 兩次造成重複入帳
const inFlight=new Set();
async function confirmExpense(idx,quiet){
  const item=expenses[idx];
  if(!item||confirmedSet.has(item._id)||inFlight.has(item._id))return;
  inFlight.add(item._id);
  if(!quiet)showStatus('寫入中...','info');
  const KR={'日幣':0.22,'美金':32,'歐元':35};
  const rate=item.rate||KR[item.currency]||1;
  const payload={token:config.token,date:item.date,description:item.description,amount:item.amount,payment:item.payment,currency:item.currency,category:item.category,rate:rate,amountTWD:item.currency==='新台幣'?item.amount:Math.round(item.amount*rate)};
  try{
    // text/plain＝簡單請求不觸發 CORS preflight，GAS 會回真實結果
    // （舊版 no-cors 盲寄：token 錯、額度用完都照樣顯示「已入帳」，帳默默消失）
    const resp=await fetch(config.sheetUrl,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)});
    if(!resp.ok)throw new Error('GAS 回應 '+resp.status);
    const emsg=gasError(await resp.text());
    if(emsg)throw new Error(emsg);
    markConfirmed(item,payload);
    if(!quiet)showStatus('✓ 已入帳','ok');
  }catch(err){
    if(err instanceof TypeError){
      // 讀不到回應（CORS 被攔）：請求其實已送達 GAS，維持舊版語意但如實告知
      markConfirmed(item,payload);
      if(!quiet)showStatus('已送出（無法確認結果，請稍後在紀錄頁核對）','info');
    }else{
      showStatus('寫入失敗: '+err.message,'err');
    }
  }finally{inFlight.delete(item._id);}
}

// === Auto Post（午夜自動過帳）===
// 未入帳草稿過了記帳當天的午夜（日期<今天）一律自動入帳：
// 開 App、切回 App、開著跨午夜（每分鐘檢查）時觸發。
// PWA 半夜不一定開著，所以用「下次看到就補過帳」達成同樣效果。
// 剛解析出來的草稿保留 10 分鐘檢查窗口（補記前幾天的帳日期<今天，
// 沒有緩衝的話還來不及改分類就被送出了）
const AUTOPOST_GRACE=10*60*1000;
let autoPosting=false;
async function autoPostPending(){
  if(autoPosting||!config?.sheetUrl||!config?.token)return;
  const today=getLocalDate();
  const targets=expenses.filter(it=>!confirmedSet.has(it._id)&&it.date&&it.date<today&&(!it._ts||Date.now()-it._ts>AUTOPOST_GRACE));
  if(!targets.length)return;
  autoPosting=true;
  let ok=0;
  try{
    for(const it of targets){
      const idx=expenses.findIndex(x=>x._id===it._id);
      if(idx<0)continue;
      await confirmExpense(idx,true); // 逐筆送，quiet＝不洗版，失敗訊息照常顯示
      if(confirmedSet.has(it._id))ok++;
    }
  }finally{autoPosting=false;}
  if(ok)showStatus('⏰ 已自動過帳 '+ok+' 筆（前一日未入帳項目）','ok');
}
function markConfirmed(item,p){
  confirmedSet.add(item._id);saveExpenses();renderExpenses();
  // 直接把這筆補進本地快取：舊版清空 sheetData 整份重抓，是切換頁面卡頓的主因
  if(sheetData.length)sheetData.push({date:p.date,description:p.description,amount:p.amount,payment:p.payment,currency:p.currency,category:p.category,rate:p.rate,amountTWD:p.amountTWD});
}
function deleteExpense(idx){const id=expenses[idx]._id;expenses.splice(idx,1);confirmedSet.delete(id);saveExpenses();renderExpenses();}
function openEdit(idx){editIdx=idx;const item=expenses[idx];document.getElementById('editDate').value=item.date;document.getElementById('editDesc').value=item.description;document.getElementById('editAmount').value=item.amount;document.getElementById('editPayment').value=item.payment;document.getElementById('editCurrency').value=item.currency;document.getElementById('editCategory').value=item.category||'外食';document.getElementById('editRate').value=item.rate||1;document.getElementById('editTWD').value=item.amountTWD||item.amount;document.getElementById('editModal').classList.add('show');}
function closeEdit(){document.getElementById('editModal').classList.remove('show');editIdx=null;}
function saveEdit(){if(editIdx===null)return;const rate=parseFloat(document.getElementById('editRate').value)||1;const amt=parseFloat(document.getElementById('editAmount').value)||0;expenses[editIdx]={...expenses[editIdx],date:document.getElementById('editDate').value,description:document.getElementById('editDesc').value,amount:amt,payment:document.getElementById('editPayment').value,currency:document.getElementById('editCurrency').value,category:document.getElementById('editCategory').value,rate:rate,amountTWD:parseFloat(document.getElementById('editTWD').value)||Math.round(amt*rate)};saveExpenses();renderExpenses();closeEdit();}

// === Load Sheet Data ===
async function loadSheetData(){
  if(!config?.sheetUrl||!config?.token){showStatus('請先設定','err');return;}
  document.getElementById('historyList').innerHTML='<div class="loading">載入中...</div>';
  try{
    const resp=await fetch(config.sheetUrl+'?token='+encodeURIComponent(config.token));
    const raw=await resp.text();
    let data;
    try{data=JSON.parse(raw);}catch{throw new Error(gasError(raw)||'GAS 回應不是 JSON');}
    if(!Array.isArray(data))throw new Error(gasError(raw)||'資料格式錯誤');
    sheetData=data.map(r=>({date:normalizeDate(r['日期']||r.date||''),description:r['項目']||r.description||'',amount:parseFloat(String(r['金額']||r.amount||0).replace(/,/g,'')),payment:r['付款方式']||r.payment||'',currency:r['幣別']||r.currency||'新台幣',category:r['分類']||r.category||'外食',rate:parseFloat(r['匯率']||r.rate||1)||1,amountTWD:parseFloat(String(r['台幣等值']||r.amountTWD||0).replace(/,/g,''))||0})).filter(r=>r.amount&&!isNaN(r.amount));
    // If rate=1 but currency is foreign, apply known rates (handles empty 匯率 column)
    const KNOWN_RATES={'日幣':0.22,'美金':32,'歐元':35};
    sheetData.forEach(r=>{
      if(r.rate===1&&r.currency!=='新台幣'&&KNOWN_RATES[r.currency])r.rate=KNOWN_RATES[r.currency];
      if(!r.amountTWD||(r.currency!=='新台幣'&&r.amountTWD===r.amount))r.amountTWD=Math.round(r.amount*r.rate);
    });
    renderOverview();renderHistory();renderCC();
  }catch(err){
    document.getElementById('historyList').innerHTML='<div class="loading">載入失敗：'+err.message+'</div>';
    // 開 App 就自動載入，人在記帳頁看不到紀錄頁的錯誤訊息，狀態列也要講
    showStatus('讀取資料失敗：'+err.message,'err');
  }
}
function normalizeDate(d){
  if(!d)return'';
  const s=String(d);
  // 2026年4月2日
  const m1=s.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
  if(m1)return m1[1]+'-'+m1[2].padStart(2,'0')+'-'+m1[3].padStart(2,'0');
  // 2026-04-02 or 2026/04/02 or 2026/4/2
  const m2=s.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if(m2)return m2[1]+'-'+m2[2].padStart(2,'0')+'-'+m2[3].padStart(2,'0');
  // "Thu Apr 02 2026" or similar - extract from Date but use UTC to avoid timezone shift
  const dt=new Date(s);
  if(!isNaN(dt)){
    // Use the date parts directly to avoid timezone issues
    const y=dt.getFullYear(),mo=dt.getMonth()+1,da=dt.getDate();
    return y+'-'+String(mo).padStart(2,'0')+'-'+String(da).padStart(2,'0');
  }
  return s;
}

// === Overview ===
function setPeriod(p,btn){
  currentPeriod=p;
  document.querySelectorAll('.period-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  const ys=document.getElementById('yearSelector');
  if(p==='all'){ys.style.display='flex';document.getElementById('yearLabel').textContent=selectedYear;}
  else{ys.style.display='none';}
  renderOverview();
}
function changeYear(delta){
  selectedYear+=delta;
  document.getElementById('yearLabel').textContent=selectedYear;
  renderOverview();
}
function getFilteredData(){
  const now=new Date(),today=getLocalDate(),dow=now.getDay()||7,ws=new Date(now);ws.setDate(now.getDate()-dow+1);const ms=new Date(now.getFullYear(),now.getMonth(),1);
  return sheetData.filter(r=>{if(r.category==='帳務轉帳')return false;const d=r.date;if(currentPeriod==='today')return d===today;if(currentPeriod==='week')return d>=fmtLocal(ws)&&d<=today;if(currentPeriod==='month')return d>=fmtLocal(ms)&&d<=today;if(currentPeriod==='all')return d.startsWith(selectedYear+'-');return true;});
}
function renderOverview(){
  const data=getFilteredData(),total=data.reduce((s,r)=>s+r.amountTWD,0),count=data.length;
  let days=1;if(currentPeriod==='week')days=new Date().getDay()||7;else if(currentPeriod==='month')days=new Date().getDate();else if(currentPeriod==='all'){const now=new Date();if(selectedYear===now.getFullYear()){const start=new Date(selectedYear,0,1);days=Math.max(1,Math.round((now-start)/86400000));}else{days=365;}}
  document.getElementById('ovTotal').textContent='$'+Math.round(total).toLocaleString();
  document.getElementById('ovCount').textContent=count;
  document.getElementById('ovAvg').textContent='$'+Math.round(days>0?total/days:0).toLocaleString();
  const catMap={};data.forEach(r=>{catMap[r.category]=(catMap[r.category]||0)+r.amountTWD;});drawPie(catMap);
  const payMap={};data.forEach(r=>{payMap[r.payment]=(payMap[r.payment]||0)+r.amountTWD;});renderPayStats(payMap);
}
function drawPie(catMap){
  const canvas=document.getElementById('pieChart'),ctx=canvas.getContext('2d'),entries=Object.entries(catMap).sort((a,b)=>b[1]-a[1]),total=entries.reduce((s,e)=>s+e[1],0);
  ctx.clearRect(0,0,200,200);const cx=100,cy=100,r=85;
  if(total===0){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle='#e8e0d6';ctx.fill();ctx.fillStyle='#b5a99a';ctx.font='13px "Zen Maru Gothic"';ctx.textAlign='center';ctx.fillText('尚無資料',cx,cy+5);document.getElementById('pieLegend').innerHTML='';return;}
  let sa=-Math.PI/2;entries.forEach(([cat,val])=>{const sl=(val/total)*Math.PI*2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,sa,sa+sl);ctx.closePath();ctx.fillStyle=CAT_COLORS[cat]||'#b5a99a';ctx.fill();sa+=sl;});
  ctx.beginPath();ctx.arc(cx,cy,50,0,Math.PI*2);ctx.fillStyle='#fffdf9';ctx.fill();
  ctx.fillStyle='#4a3f35';ctx.font='bold 16px "Zen Maru Gothic"';ctx.textAlign='center';ctx.fillText('$'+Math.round(total).toLocaleString(),cx,cy+1);
  ctx.fillStyle='#8c7e72';ctx.font='10px "Zen Maru Gothic"';ctx.fillText('合計',cx,cy+16);
  document.getElementById('pieLegend').innerHTML=entries.map(([cat,val])=>{const icon=ICONS[cat]||'📌';return`<div class="legend-item"><div class="legend-dot" style="background:${CAT_COLORS[cat]||'#b5a99a'}"></div>${icon} ${cat} ${Math.round(val/total*100)}%</div>`;}).join('');
}
function renderPayStats(payMap){
  const el=document.getElementById('payStats'),entries=Object.entries(payMap).sort((a,b)=>b[1]-a[1]),max=entries.length>0?entries[0][1]:1;
  if(!entries.length){el.innerHTML='<div class="loading">尚無資料</div>';return;}
  el.innerHTML=entries.map(([pay,val])=>{const pct=Math.round(val/max*100),color=PAY_COLORS[pay]||'#c4956a',short=pay.replace(/\(.*\)/,'').trim();return`<div class="pay-stat"><div class="name">${short}</div><div class="bar"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div><div class="amount">$${Math.round(val).toLocaleString()}</div></div>`;}).join('');
}

// === Credit Cards ===
function getRewardCap(card){
  const rule=REWARD_RULES[card.full];if(!rule)return null;
  const ym=getLocalDate().slice(0,7);
  const spent=sheetData.filter(r=>r.payment===card.full&&r.date.startsWith(ym)&&rule.match(r)).reduce((s,r)=>s+Math.abs(r.amountTWD),0);
  return{rule,spent,pct:Math.min(100,Math.round(spent/rule.cap*100))};
}
function warnRewardCaps(){
  const msgs=[];
  CARDS.forEach(card=>{
    const c=getRewardCap(card);if(!c||c.pct<80)return;
    msgs.push(c.spent>=c.rule.cap?`${card.name}${c.rule.label}已達上限`:`${card.name}${c.rule.label}只剩 $${(c.rule.cap-c.spent).toLocaleString()}`);
  });
  if(!msgs.length)return;
  if(localStorage.getItem('bal-capwarn')===getLocalDate())return;// 每天最多提醒一次
  localStorage.setItem('bal-capwarn',getLocalDate());
  showStatus('⚠️ '+msgs.join('；'),'info');
}
function getBillingPeriod(closeDay,offset=0){const now=new Date(),y=now.getFullYear(),m=now.getMonth(),d=now.getDate();let s,e;if(d<=closeDay){s=new Date(y,m-1,closeDay+1);e=new Date(y,m,closeDay);}else{s=new Date(y,m,closeDay+1);e=new Date(y,m+1,closeDay);}if(offset!==0){s=new Date(s.getFullYear(),s.getMonth()+offset,s.getDate());e=new Date(e.getFullYear(),e.getMonth()+offset,e.getDate());}return{start:s,end:e};}
function changeCCPeriod(full,delta){const cur=ccPeriodOffsets[full]||0,next=cur+delta;if(next>0)return;ccPeriodOffsets[full]=next;renderCC();}
function fmtD(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function renderCC(){
  const list=document.getElementById('ccList'),det=document.getElementById('ccDetail');
  if(!sheetData.length){list.innerHTML='<div class="loading">載入中...</div>';det.innerHTML='';return;}
  let h='';
  CARDS.forEach(card=>{
    const offset=ccPeriodOffsets[card.full]||0;
    const p=getBillingPeriod(card.close,offset);
    const items=sheetData.filter(r=>r.payment===card.full&&(()=>{const d=parseLocalDate(r.date);return d>=p.start&&d<=p.end;})());
    const total=items.reduce((s,r)=>s+Math.abs(r.amountTWD),0);
    const sel=selectedCard===card.full?' selected':'';
    const color=PAY_COLORS[card.full]||'#c4956a';
    const btnStyle='border:none;background:var(--card);border-radius:6px;padding:2px 8px;font-size:13px;cursor:pointer;color:var(--accent);border:1px solid var(--border)';
    const rightDisabled=offset>=0?'opacity:0.3;pointer-events:none':'';
    const cap=getRewardCap(card);
    let capHtml='';
    if(cap){
      const full=cap.spent>=cap.rule.cap;
      const barColor=full?'#c47a7a':cap.pct>=80?'#c49a6a':'#7a9e7e';
      const capText=full?`⚠️ ${cap.rule.label}已達上限（${cap.rule.tip}）`:`${cap.rule.label} 本月 $${Math.round(cap.spent).toLocaleString()} / $${cap.rule.cap.toLocaleString()}｜剩 $${Math.round(cap.rule.cap-cap.spent).toLocaleString()}`;
      capHtml=`<div style="margin-top:6px"><div style="height:5px;background:var(--border);border-radius:3px;overflow:hidden"><div style="height:100%;width:${cap.pct}%;background:${barColor}"></div></div><div style="font-size:11px;color:${full?'#c47a7a':'var(--text-muted)'};margin-top:3px">${capText}</div></div>`;
    }
    h+=`<div class="cc-card${sel}" onclick="selCard('${card.full}')"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="cc-name" style="color:${color}">${card.name}</div><div class="cc-cycle">結帳 ${card.close}日 ｜繳款 ${card.pay}日</div></div><div class="cc-total" style="color:${color}">$${total.toLocaleString()}</div></div><div style="display:flex;align-items:center;gap:4px;margin-top:6px" onclick="event.stopPropagation()"><button style="${btnStyle}" onclick="changeCCPeriod('${card.full}',-1)">◀</button><span style="flex:1;text-align:center;font-size:11px;color:var(--text-muted)">${fmtD(p.start)} ~ ${fmtD(p.end)}</span><button style="${btnStyle};${rightDisabled}" onclick="changeCCPeriod('${card.full}',1)">▶</button></div>${capHtml}</div>`;
  });
  list.innerHTML=h;renderCCDetail();
}
function selCard(f){selectedCard=selectedCard===f?null:f;renderCC();}
function renderCCDetail(){
  const det=document.getElementById('ccDetail');if(!selectedCard||!sheetData.length){det.innerHTML='';return;}
  const card=CARDS.find(c=>c.full===selectedCard);if(!card)return;
  const offset=ccPeriodOffsets[card.full]||0;
  const p=getBillingPeriod(card.close,offset);
  const items=sheetData.filter(r=>r.payment===card.full&&(()=>{const d=parseLocalDate(r.date);return d>=p.start&&d<=p.end;})()).sort((a,b)=>b.date.localeCompare(a.date));
  if(!items.length){det.innerHTML='<div class="loading">當期無交易</div>';return;}
  let h='<div class="cc-detail">';
  items.forEach(r=>{const icon=ICONS[r.category]||'📌';const isForeign=r.currency!=='新台幣';const amtDisplay=isForeign?`${r.currency} ${Math.abs(r.amount).toLocaleString()}<br><span style="font-size:11px;color:var(--text-muted)">≈$${Math.abs(r.amountTWD).toLocaleString()}</span>`:`$${Math.abs(r.amountTWD).toLocaleString()}`;h+=`<div class="cc-detail-item"><div>${icon} ${r.description}<br><span style="font-size:11px;color:var(--text-muted)">${r.date} · ${r.category}</span></div><div style="font-weight:600;text-align:right">${amtDisplay}</div></div>`;});
  det.innerHTML=h+'</div>';
}

// === History ===
function changeHistMonth(delta){
  histMonth+=delta;
  if(histMonth>12){histMonth=1;histYear++;}
  if(histMonth<1){histMonth=12;histYear--;}
  updateHistLabel();
  renderHistory();
}
function updateHistLabel(){
  document.getElementById('histMonthLabel').textContent=histYear+'年'+histMonth+'月';
}
function renderHistory(){
  updateHistLabel();
  const el=document.getElementById('historyList');
  const keyword=(document.getElementById('histSearch')?.value||'').trim().toLowerCase();
  const ym=histYear+'-'+String(histMonth).padStart(2,'0');

  let filtered=sheetData.filter(r=>r.date.startsWith(ym));
  if(keyword){filtered=filtered.filter(r=>r.description.toLowerCase().includes(keyword)||r.payment.toLowerCase().includes(keyword)||r.category.toLowerCase().includes(keyword));}
  const sorted=filtered.sort((a,b)=>b.date.localeCompare(a.date));

  if(!sorted.length){el.innerHTML='<div class="loading">'+(keyword?'找不到「'+keyword+'」的紀錄':'本月無紀錄')+'</div>';return;}

  // 疑似重複偵測：同日＋同金額＋同帳戶出現 2 筆以上（以全部資料計，不受搜尋關鍵字影響）。
  // 手動記完自動入帳又補一筆、或補記時忘了已記過，都會長這樣；YouBike 之類同價多趟是正常的
  const dupCount={};
  sheetData.forEach(r=>{const k=r.date+'|'+r.amount+'|'+r.payment;dupCount[k]=(dupCount[k]||0)+1;});
  const monthDupKeys=new Set();
  sheetData.forEach(r=>{if(r.date.startsWith(ym)){const k=r.date+'|'+r.amount+'|'+r.payment;if(dupCount[k]>1)monthDupKeys.add(k);}});

  let lastDate='',html='',monthTotal=0;
  sorted.forEach(r=>{
    if(r.date!==lastDate){lastDate=r.date;html+=`<div style="font-size:12px;color:var(--text-muted);font-weight:600;margin-top:12px;margin-bottom:4px">${r.date}</div>`;}
    const icon=ICONS[r.category]||'📌',isForeign=r.currency!=='新台幣';
    const amtText=isForeign?`${r.currency} ${Math.round(r.amount).toLocaleString()} ≈$${Math.round(r.amountTWD).toLocaleString()}`:`$${Math.round(r.amountTWD).toLocaleString()}`;
    const dupTag=dupCount[r.date+'|'+r.amount+'|'+r.payment]>1?'<span class="dup-tag">疑似重複</span>':'';
    html+=`<div class="record-row"><div><div class="record-desc">${icon} ${r.description}${dupTag}</div><div class="record-meta">${r.payment.replace(/\(.*\)/,'').trim()} · ${r.category}</div></div><div class="record-amount">${amtText}</div></div>`;
    if(r.category!=='帳務轉帳')monthTotal+=r.amountTWD;
  });
  const banner=monthDupKeys.size?`<div class="dup-banner">⚠️ 本月有 ${monthDupKeys.size} 組「同日、同金額、同帳戶」的紀錄，已標示「疑似重複」。請到 balance 試算表核對，確認重複的直接刪除該列（同價多趟的交通、咖啡等屬正常）。</div>`:'';
  const summary=`<div style="text-align:center;padding:12px;font-size:13px;color:var(--text-light)">${sorted.length} 筆 ｜ 合計 $${Math.round(monthTotal).toLocaleString()}</div>`;
  el.innerHTML=banner+summary+'<div class="card">'+html+'</div>';
}

// === Init ===
window.addEventListener('DOMContentLoaded',()=>{
  if(!loadConfig())openSetup();
  loadExpenses();renderExpenses();
  if(config?.sheetUrl&&config?.token)loadSheetData().then(warnRewardCaps);
  autoPostPending();
  setInterval(autoPostPending,60000); // App 開著跨午夜也會過帳
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)autoPostPending();});
});
</script>
